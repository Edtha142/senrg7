<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENRG7 — Iniciar Sesión</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0e1a;
      --card:      #141a2e;
      --border:    #1e2a45;
      --accent:    #00c896;
      --accent-hv: #00e6ad;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --danger:    #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(0,200,150,.07) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0,100,255,.05) 0%, transparent 60%);
    }

    .contenedor {
      width: 100%;
      max-width: 400px;
    }

    /* Logo / Marca */
    .marca {
      text-align: center;
      margin-bottom: 2rem;
    }
    .marca-icono {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #00c896, #0066ff);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 0 32px rgba(0,200,150,.3);
    }
    .marca-icono svg { width: 34px; height: 34px; fill: #fff; }
    .marca h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: .12em;
      background: linear-gradient(90deg, #00c896, #4fc3f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .marca p {
      color: var(--muted);
      font-size: .85rem;
      margin-top: .3rem;
      letter-spacing: .03em;
    }

    /* Tarjeta de login */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: .5rem;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .75rem 1rem;
      color: var(--text);
      font-size: .95rem;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,200,150,.15);
    }

    .btn-login {
      width: 100%;
      padding: .85rem;
      background: linear-gradient(135deg, #00c896, #0088cc);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .05em;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      margin-top: .5rem;
    }
    .btn-login:hover  { opacity: .9; }
    .btn-login:active { transform: scale(.98); }

    /* Mensaje de error */
    .error-msg {
      display: none;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px;
      padding: .75rem 1rem;
      color: #fca5a5;
      font-size: .88rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }
    .error-msg.visible { display: block; }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: .75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <!-- Marca -->
    <div class="marca">
      <div class="marca-icono">
        <!-- Ícono de rayo eléctrico -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L3 14h9l-1 8 10-12h-9z"/>
        </svg>
      </div>
      <h1>SENRG7</h1>
      <p>Sistema de Monitoreo de Energía Industrial</p>
    </div>

    <!-- Formulario -->
    <div class="card">
      <div id="errorMsg" class="error-msg">
        Usuario o contraseña incorrectos
      </div>

      <form id="formLogin" method="POST" action="/login">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            placeholder="admin"
            required
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••••"
            required
          >
        </div>

        <button type="submit" class="btn-login">INGRESAR</button>
      </form>
    </div>

    <div class="footer">
      ITSa — Informática Industrial &nbsp;|&nbsp; Cochabamba, Bolivia
    </div>
  </div>

  <script>
    // Mostrar error si el servidor devolvió 401 o si hay parámetro ?error en la URL
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.has('error')) {
        document.getElementById('errorMsg').classList.add('visible');
      }
    })();

    // Interceptar envío para mostrar error en la misma página (respuesta 401 del servidor)
    document.getElementById('formLogin').addEventListener('submit', async function (e) {
      e.preventDefault();
      const form = e.target;
      const data = new URLSearchParams(new FormData(form));

      try {
        const resp = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: data,
          redirect: 'manual',   // no seguir redirecciones automáticamente
        });

        if (resp.status === 0 || resp.type === 'opaqueredirect') {
          // Redirección exitosa → navegar al dashboard
          window.location.href = '/dashboard';
        } else if (resp.status === 303) {
          window.location.href = resp.headers.get('Location') || '/dashboard';
        } else if (resp.status === 401) {
          document.getElementById('errorMsg').classList.add('visible');
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        } else {
          document.getElementById('errorMsg').classList.add('visible');
        }
      } catch (err) {
        console.error('Error de red:', err);
        document.getElementById('errorMsg').classList.add('visible');
      }
    });
  </script>
</body>
</html>
